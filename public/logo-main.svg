<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="50%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with silhouettes -->
  <circle cx="75" cy="75" r="60" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
  <circle cx="75" cy="75" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>

  <!-- People silhouettes -->
  <g fill="#8B7355" opacity="0.6">
    <!-- Person 1 -->
    <ellipse cx="55" cy="95" rx="8" ry="15"/>
    <circle cx="55" cy="78" r="6"/>
    <path d="M50 85 Q55 75 60 85" stroke="#8B7355" stroke-width="3" fill="none"/>

    <!-- Person 2 (center, raised arms) -->
    <ellipse cx="75" cy="92" rx="10" ry="18"/>
    <circle cx="75" cy="72" r="7"/>
    <path d="M65 82 Q75 65 85 82" stroke="#8B7355" stroke-width="4" fill="none"/>
    <path d="M60 70 L65 85 M90 70 L85 85" stroke="#8B7355" stroke-width="3" fill="none"/>

    <!-- Person 3 -->
    <ellipse cx="95" cy="95" rx="8" ry="15"/>
    <circle cx="95" cy="78" r="6"/>
    <path d="M90 85 Q95 75 100 85" stroke="#8B7355" stroke-width="3" fill="none"/>
    <path d="M100 75 L105 65" stroke="#8B7355" stroke-width="2" fill="none"/>
  </g>

  <!-- Arabic text: اتحاد بشبابها -->
  <text x="220" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">اتحاد بشبابها</text>

  <!-- English text: UNION OF BE-SHABABHA -->
  <text x="220" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#B8860B" text-anchor="middle" letter-spacing="2">UNION OF BE-SHABABHA</text>

  <!-- Subtitle -->
  <text x="220" y="110" font-family="Arial, sans-serif" font-size="11" fill="#8B7355" text-anchor="middle">نشأت جهوية وطنية</text>

  <!-- Decorative line -->
  <line x1="140" y1="95" x2="300" y2="95" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>
  <circle cx="140" cy="95" r="2" fill="#D4AF37"/>
  <circle cx="300" cy="95" r="2" fill="#D4AF37"/>
</svg>
